[package]
name = "Celestial"
version = "1.3.0"
edition = "2021"
rust-version = "1.65"
description = "Fast terminal YouTube audio/video downloader powered by yt-dlp"
license = "MIT"
repository = "https://github.com/kradengdeng/Celestial"

[dependencies]
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
