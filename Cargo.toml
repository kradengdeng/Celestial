[package]
name = "celestial"
version = "1.1.0"
edition = "2021"
description = "Fast terminal YouTube audio/video downloader powered by yt-dlp"

[dependencies]
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
winapi = { version = "0.3", features = ["winuser", "libloaderapi", "wincon"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true